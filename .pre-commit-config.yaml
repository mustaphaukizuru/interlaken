# Install once:  pip install pre-commit && pre-commit install
# Run on all files:  pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        files: ^backend/
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.8.1
    hooks:
      - id: eslint
        files: ^frontend/src/.*\.(ts|tsx)$
        types: [file]
        # Flat config (frontend/eslint.config.js) imports its plugins from
        # frontend/node_modules via normal Node resolution, so the hook env only
        # needs eslint itself — run `npm install` in frontend/ first.
        additional_dependencies:
          - eslint@10.8.1
