<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon / app icons (clock isotipo) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#401a8e" />

    <title>Colegio Interlaken — Educación bilingüe en Tlalnepantla</title>
    <meta name="description" content="Colegio Interlaken — Educación bilingüe de excelencia en Tlalnepantla, Estado de México. Preescolar, primaria y secundaria con más de cuatro décadas de trayectoria." />
    <link rel="canonical" href="https://interlaken.edu.mx/" />

    <!-- Structured data: School / EducationalOrganization / LocalBusiness.
         Static so it's always in the initial HTML for the Rich Results test. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["School", "EducationalOrganization", "LocalBusiness"],
      "@id": "https://interlaken.edu.mx/#organization",
      "name": "Colegio Interlaken",
      "legalName": "Colegio Interlaken",
      "url": "https://interlaken.edu.mx",
      "logo": "https://interlaken.edu.mx/assets/logo-horizontal.png",
      "image": "https://interlaken.edu.mx/og-image.png",
      "description": "Educación bilingüe de excelencia en Tlalnepantla, Estado de México. Preescolar, primaria y secundaria con más de cuatro décadas de trayectoria.",
      "telephone": "+52-55-5379-1188",
      "email": "colegio@interlaken.edu.mx",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Tlalnepantla de Baz",
        "addressLocality": "Tlalnepantla de Baz",
        "addressRegion": "Estado de México",
        "postalCode": "54000",
        "addressCountry": "MX"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 19.5407,
        "longitude": -99.1955
      },
      "sameAs": [
        "https://facebook.com",
        "https://instagram.com",
        "https://youtube.com"
      ],
      "areaServed": "Tlalnepantla de Baz, Estado de México"
    }
    </script>

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Colegio Interlaken" />
    <meta property="og:title" content="Colegio Interlaken" />
    <meta property="og:description" content="Educación bilingüe de excelencia en Tlalnepantla, Estado de México. Tiempo de educar, tiempo de aprender." />
    <meta property="og:url" content="https://interlaken.edu.mx/" />
    <meta property="og:image" content="https://interlaken.edu.mx/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_MX" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Colegio Interlaken" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
