name: CI

on:
  push:
    branches: [master, main, automated-build]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · black · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      # Force SQLite and provide throwaway secrets so settings import cleanly
      # without a .env file. No real credentials, no external services.
      SQLITE_LOCAL: '1'
      SECRET_KEY: ci-test-secret-key-not-for-production
      DB_NAME: test_interlaken
      GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-client-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.20 black==26.5.1

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black, advisory)
        # Non-blocking: the existing codebase predates black; new code is formatted.
        run: black --check --diff . || echo "::warning::Black would reformat some files (advisory, non-blocking)"

      - name: Django system check
        run: python manage.py check

      - name: Tests (pytest on SQLite)
        run: pytest

  frontend:
    name: Frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm run test

      - name: Build (vite)
        run: npm run build

      # Performance budget gate — fails on public-route JS regressions
      # (see docs/PERFORMANCE.md for budgets + the allowlist policy).
      - name: Check performance budgets
        run: npm run check:budgets

      # The Render Docker image builds the SPA fresh (Dockerfile stage 1), so no
      # committed-static freshness gate is needed anymore (it was a cPanel-era
      # requirement). We still assert the push companion SW ships in dist.
      - name: Assert push companion SW is in dist
        run: |
          test -f dist/push-sw.js
          grep -q showNotification dist/push-sw.js
          grep -q notificationclick dist/push-sw.js

  e2e:
    name: E2E (Playwright — money flows)
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      # SQLite + throwaway secrets so settings import without a .env file.
      SQLITE_LOCAL: '1'
      SECRET_KEY: ci-test-secret-key-not-for-production
      DB_NAME: test_interlaken
      GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-client-secret
      # The suite logs in ~19×/run — opt out of the 10/min login rate limit
      # (honored by config.settings.development only; production is unaffected).
      RATELIMIT_DISABLE: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate + seed the E2E user (SQLite)
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_e2e_user

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Cache the browser download (~115 MB) keyed on the Playwright version;
      # `playwright install` becomes a no-op on a hit.
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Functional suite is BLOCKING. Visual specs run separately below: baselines
      # are per-platform and only win32 is committed, so on linux the visual step
      # GENERATES baselines (uploaded as an artifact — commit them to enable strict
      # CI visual diffs, see frontend/e2e/README.md) without failing the job.
      - name: Run E2E (Playwright boots both dev servers)
        working-directory: frontend
        run: npm run test:e2e -- --grep-invert "Visual baselines"

      - name: Generate visual baselines (advisory until linux baselines are committed)
        working-directory: frontend
        continue-on-error: true
        run: npm run test:e2e -- --grep "Visual baselines" --update-snapshots

      - name: Upload visual baselines (linux — commit these to enable CI visual diffs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: frontend/e2e/visual.spec.ts-snapshots/
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security-audit:
    # Advisory (non-blocking): surfaces known CVEs in dependencies without
    # gating merges. Tighten to blocking once the baseline is clean.
    name: Dependency audit (pip-audit · npm audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: pip-audit (backend)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict || echo "::warning::pip-audit found vulnerable Python dependencies"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (frontend, high+)
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit found high-severity advisories"
