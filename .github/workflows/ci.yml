name: CI

on:
  push:
    branches: [master, main, automated-build]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · black · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      # Force SQLite and provide throwaway secrets so settings import cleanly
      # without a .env file. No real credentials, no external services.
      SQLITE_LOCAL: '1'
      SECRET_KEY: ci-test-secret-key-not-for-production
      DB_NAME: test_interlaken
      GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-client-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.20 black==26.5.1

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black, advisory)
        # Non-blocking: the existing codebase predates black; new code is formatted.
        run: black --check --diff . || echo "::warning::Black would reformat some files (advisory, non-blocking)"

      - name: Django system check
        run: python manage.py check

      - name: Tests (pytest on SQLite)
        run: pytest

  frontend:
    name: Frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm run test

      - name: Build (vite)
        run: npm run build

      # cPanel deploy has no Node — production SPA is the committed
      # backend/static + templates/index.html tree. Fail CI if that tree
      # drifts from a fresh Vite build (e.g. missing push-sw.js).
      - name: Assert push companion SW is in dist
        run: |
          test -f dist/push-sw.js
          grep -q showNotification dist/push-sw.js
          grep -q notificationclick dist/push-sw.js

      - name: Stage SPA for Django and verify committed static is fresh
        working-directory: .
        run: |
          python3 scripts/build_frontend.py --skip-build
          git add -A -- backend/static backend/templates/index.html
          git diff --cached --exit-code -- backend/static backend/templates/index.html

  e2e:
    name: E2E (Playwright — money flows)
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      # SQLite + throwaway secrets so settings import without a .env file.
      SQLITE_LOCAL: '1'
      SECRET_KEY: ci-test-secret-key-not-for-production
      DB_NAME: test_interlaken
      GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-client-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate + seed the E2E user (SQLite)
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_e2e_user

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E (Playwright boots both dev servers)
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security-audit:
    # Advisory (non-blocking): surfaces known CVEs in dependencies without
    # gating merges. Tighten to blocking once the baseline is clean.
    name: Dependency audit (pip-audit · npm audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip-audit (backend)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict || echo "::warning::pip-audit found vulnerable Python dependencies"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (frontend, high+)
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit found high-severity advisories"
