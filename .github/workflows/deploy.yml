name: Deploy (cPanel)

# Manual-only deployment to the GoDaddy cPanel host. This never runs on push —
# trigger it from the Actions tab ("Run workflow"). It SSHes in, pulls the
# selected ref, installs backend deps, migrates, collects static files, and
# restarts Passenger by touching tmp/restart.txt.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CPANEL_SSH_HOST      e.g. interlaken.edu.mx
#   CPANEL_SSH_PORT      usually 22 (GoDaddy sometimes uses a custom port)
#   CPANEL_SSH_USER      e.g. rene82
#   CPANEL_SSH_KEY       private key (PEM) authorised on the host
#   CPANEL_APP_DIR       absolute path to the repo checkout on the host
#   CPANEL_PY            path to the app's python (virtualenv), e.g. ~/venv/bin/python
#
# Until every secret is set this workflow is a documented no-op you can read as
# the deploy runbook.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch/tag/SHA) to deploy
        required: true
        default: master

jobs:
  deploy:
    name: SSH deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.CPANEL_APP_DIR }}"
            git fetch --all --prune
            git checkout "${{ github.event.inputs.ref }}"
            git pull --ff-only origin "${{ github.event.inputs.ref }}"
            "${{ secrets.CPANEL_PY }}" -m pip install -r backend/requirements.txt
            cd backend
            "${{ secrets.CPANEL_PY }}" manage.py migrate --noinput
            "${{ secrets.CPANEL_PY }}" manage.py collectstatic --noinput
            # Passenger reloads the app when this file's mtime changes.
            mkdir -p tmp && touch tmp/restart.txt
            echo "Deploy of ${{ github.event.inputs.ref }} complete."
