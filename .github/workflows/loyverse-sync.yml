name: Loyverse cafeteria sync

# Free "cron" for the cafeteria sync: runs the management commands against the
# Supabase DB directly, so balances/purchases stay fresh even while the Render
# free web service is asleep. GitHub cron granularity is ~5 min and best-effort.
#
# ⚠️ Before enabling: set the CAFETERIA_SYNC_PURCHASES_SINCE secret to your
# go-live datetime (ISO-8601, e.g. 2026-08-01T00:00:00Z). Without a watermark the
# first purchase sync would backfill history and double-debit balances.
#
# Free-minutes note: private repos get 2000 Action-min/month. At ~1 min/run the
# 30-min cadence below is ~2160 min — bump to '0 * * * *' (hourly) to stay under,
# or make the repo public (unlimited), or trigger via cron-job.org instead.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: loyverse-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      LOYVERSE_API_TOKEN: ${{ secrets.LOYVERSE_API_TOKEN }}
      CAFETERIA_SYNC_PURCHASES_SINCE: ${{ secrets.CAFETERIA_SYNC_PURCHASES_SINCE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Seed balances (once per student) + poll purchases
        working-directory: backend
        run: |
          python manage.py sync_balances
          python manage.py sync_purchases
