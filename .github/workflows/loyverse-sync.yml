name: Loyverse cafeteria sync

# Free "cron" for the cafeteria sync: runs the management commands against the
# Supabase DB directly, so balances/purchases stay fresh even while the Render
# free web service is asleep. GitHub cron granularity is ~5 min (best-effort).
#
# Cadence: every 5 minutes (fastest reliable GitHub Actions schedule). For
# faster updates on cPanel use the 1-minute cron in docs/DEPLOYMENT.md, or the
# parent/admin "Actualizar / Sincronizar" buttons which poll Loyverse on demand.
#
# Required repo secrets: SECRET_KEY, LOYVERSE_API_TOKEN, DB_HOST, DB_NAME,
# DB_USER, DB_PASSWORD, DB_PORT, ALLOWED_HOSTS. Optional: CAFETERIA_SYNC_PURCHASES_SINCE
# (ISO-8601 go-live watermark). Without a watermark the first purchase sync starts
# from "now" (safe) — never backfill history or you double-debit balances already
# seeded from Loyverse points. DB_ENGINE is pinned to Postgres (Supabase).
#
# Free-minutes note: private repos get 2000 Action-min/month. At ~1 min/run the
# 5-min cadence is ~8640 min/mo — make the repo public (unlimited), keep Render
# cron, or use cPanel cron / cron-job.org if minutes matter.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: loyverse-sync
  cancel-in-progress: false

jobs:
  sync:
    # Skip quietly until repo secrets are provisioned — otherwise every cron
    # fails with ImproperlyConfigured(SECRET_KEY empty) and burns Action minutes.
    if: ${{ secrets.SECRET_KEY != '' && secrets.LOYVERSE_API_TOKEN != '' && secrets.DB_HOST != '' }}
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DB_ENGINE: ${{ secrets.DB_ENGINE }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      LOYVERSE_API_TOKEN: ${{ secrets.LOYVERSE_API_TOKEN }}
      CAFETERIA_SYNC_PURCHASES_SINCE: ${{ secrets.CAFETERIA_SYNC_PURCHASES_SINCE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Seed balances + poll purchases (fast path)
        working-directory: backend
        run: |
          python manage.py sync_balances --no-profiles
          python manage.py sync_purchases
