name: Database backup (Supabase Postgres)

# Nightly off-site backup of the production Supabase Postgres DB. Supabase's free
# tier has no scheduled backups / PITR, so this pg_dumps the DB and stores the
# gzipped dump as a GitHub Actions artifact (30-day retention). Restore with:
#   gunzip -c interlaken-db-*.sql.gz | psql "<connection-string>"
# For long-term retention, also push the dump to object storage (S3/Supabase).
#
# Uses the same DB_* secrets as the other workflows (Supabase session pooler,
# which is IPv4 + supports pg_dump; the direct 5432 host is IPv6-only).

on:
  schedule:
    - cron: '30 8 * * *'   # 02:30 America/Mexico_City (UTC-6)
  workflow_dispatch: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # postgresql-client-17 explicitly: Supabase upgraded the server to PG 17
      # and pg_dump aborts on a major-version mismatch (backups failed silently
      # 2026-08-11..15 with the runner's default client 16). The PGDG repo is
      # preconfigured on GitHub's ubuntu-24.04 runners.
      - name: Install postgresql-client 17
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Dump database (gzip)
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%d-%H%M%S)
          out="interlaken-db-${stamp}.sql.gz"
          /usr/lib/postgresql/17/bin/pg_dump \
            --no-owner --no-privileges \
            --host="${{ secrets.DB_HOST }}" \
            --port="${{ secrets.DB_PORT }}" \
            --username="${{ secrets.DB_USER }}" \
            "${{ secrets.DB_NAME }}" \
            | gzip > "$out"
          ls -lh "$out"
          # A dump that silently produced (near-)nothing is not a backup.
          test "$(stat -c%s "$out")" -gt 10240
      - name: Upload backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: interlaken-db-backup
          path: interlaken-db-*.sql.gz
          retention-days: 30
      # Backups failed for 5 days with nobody noticing — failures now open/refresh
      # a labeled issue so they surface outside the Actions tab.
      - name: Alert on failure (issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="DB backup failing"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label db-backup-failure --state open --json number --jq '.[0].number // empty')
          body="Nightly Supabase backup failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label db-backup-failure --body "$body" || \
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
