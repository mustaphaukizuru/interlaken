name: Scheduled tasks (cafetería / bookings)

# Free "cron" for the app's recurring jobs, run against Supabase directly so they
# fire even while the Render free web service is asleep. Without this, cafetería
# alerts/digests, booking reminders and notification dispatch never send.
# GitHub cron is best-effort (a few min of jitter). Public repos get unlimited
# Action minutes; a private repo gets 2000/mo — these jobs are ~1 min/day,
# negligible. The app does NOT bill tuition: the old invoice-generation,
# late-fee and tuition-reminder steps are gone for good.
#
# ⚠️ The email-sending jobs (low-balance & booking alerts) need the SendGrid
# secrets (EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD) set, or they'll
# error on send.

on:
  schedule:
    - cron: '0 9 * * *'    # daily  ~03:00 America/Mexico_City (UTC-6)
  workflow_dispatch: {}

concurrency:
  group: scheduled-tasks
  cancel-in-progress: false

env:
  DJANGO_SETTINGS_MODULE: config.settings.production
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
  DB_ENGINE: ${{ secrets.DB_ENGINE }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
  ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
  FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
  EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
  EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
  EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
  DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
  # Set to True (on both the web service and this secret) to switch cafetería to
  # digest mode: per-purchase pings are suppressed and one daily roll-up is sent.
  CAFETERIA_PURCHASE_DIGEST: ${{ secrets.CAFETERIA_PURCHASE_DIGEST }}

jobs:
  # Daily jobs (also run on manual dispatch).
  daily:
    runs-on: ubuntu-latest
    steps:
      # secrets.* cannot be used in job-level `if:` — gate here instead.
      - name: Require DB secrets
        id: gate
        run: |
          missing=0
          for v in SECRET_KEY DB_HOST DB_NAME DB_USER DB_PASSWORD DB_ENGINE; do
            if [ -z "${!v}" ]; then
              echo "::warning::$v is not set in repo secrets"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping scheduled tasks — configure GitHub Actions secrets first."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-python@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        if: steps.gate.outputs.skip != 'true'
        working-directory: backend
        run: pip install -r requirements.txt
      # Self-heal DB schema drift: these jobs hit Supabase directly, so if a
      # migration merged before Render redeployed, apply it here first (idempotent).
      - name: Apply pending migrations
        if: steps.gate.outputs.skip != 'true'
        working-directory: backend
        run: python manage.py migrate --noinput
      # Abandoned HPP sessions (parent never paid) linger as PENDING forever
      # unless the same parent re-initiates (which supersedes them on demand).
      # Sweep them daily so the deposits log / orphan report stay clean. Soft-
      # fail only: a late SUCCESS webhook still credits (is_soft_failed path),
      # so no real capture is ever lost. Sends no email.
      - name: Expire stale payment checkouts (no email)
        if: steps.gate.outputs.skip != 'true'
        working-directory: backend
        run: python manage.py expire_stale_payments
      - name: Low-balance cafetería alerts
        if: steps.gate.outputs.skip != 'true'
        working-directory: backend
        run: python manage.py low_balance_alerts
      - name: Visit reminders
        if: steps.gate.outputs.skip != 'true'
        working-directory: backend
        run: python manage.py send_booking_reminders
      - name: Daily cafetería spending digest (digest mode only)
        # Only in digest mode, so per-purchase families are never double-notified.
        if: steps.gate.outputs.skip != 'true' && (env.CAFETERIA_PURCHASE_DIGEST == 'True' || env.CAFETERIA_PURCHASE_DIGEST == 'true' || env.CAFETERIA_PURCHASE_DIGEST == '1')
        working-directory: backend
        run: python manage.py send_spending_digest --period daily
      - name: Deliver pending notifications (email + push)
        if: steps.gate.outputs.skip != 'true'
        working-directory: backend
        run: python manage.py dispatch_notifications
