# Automated dependency updates. Weekly, grouped to keep PR noise low;
# security advisories always open PRs immediately regardless of schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    groups:
      js-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # 0.5+ registers rules for flat config only; this repo is on .eslintrc.cjs.
      # Unpin when the ESLint flat-config migration happens.
      - dependency-name: eslint-plugin-react-refresh
        versions: ['>=0.5.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
