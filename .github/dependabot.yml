# Automated dependency updates. Weekly, grouped to keep PR noise low;
# security advisories always open PRs immediately regardless of schedule.
#
# POLICY (2026-08-15): semver-MAJOR updates for app dependencies are excluded.
# Majors (React 19, TypeScript 7, Django next, ...) are deliberate migration
# projects with their own branch, gates, and testing — not weekly bot PRs that
# sit red until someone does that work anyway (see closed #127/#129/#130).
# GitHub Actions majors stay enabled: low blast radius, CI-verified.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    groups:
      js-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # axios 1.21.0 adds ~2.4 kB gz to every public page (/ went over its
      # 170 kB budget) for server/proxy/HTTP-2 fixes the browser app does not
      # use, plus a header-defaults breaking change and new XSRF cookie reads
      # (our auth path). Held at 1.20.0 (#228, 2026-11-08). Only this exact
      # version is skipped: the next axios release is proposed again and the
      # budget check judges it then.
      - dependency-name: "axios"
        versions: ["1.21.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
