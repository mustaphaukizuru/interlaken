# Render Blueprint — one Docker web service on the free plan.
# After first deploy: fill the `sync:false` vars in the Render dashboard with your
# Supabase connection + the app's public URL. See docs/DEPLOY_RENDER.md.
services:
  - type: web
    name: interlaken
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong secret
      - key: PYTHON_VERSION
        value: "3.11"
      # ── Supabase Postgres (set these in the dashboard) ──────────────────
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false                  # postgres
      - key: DB_USER
        sync: false                  # postgres.<project-ref>  (Supabase pooler user)
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false                  # aws-0-<region>.pooler.supabase.com
      # ── Public URL wiring (set after Render assigns the domain) ─────────
      - key: ALLOWED_HOSTS
        sync: false                  # interlaken.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false                  # https://interlaken.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # https://interlaken.onrender.com
      - key: FRONTEND_URL
        sync: false                  # https://interlaken.onrender.com
      # ── Durable media storage (Supabase Storage, S3-compatible) ─────────
      # Render's disk is EPHEMERAL; without these, uploaded admissions
      # documents are lost on every redeploy. Create a PRIVATE bucket + S3
      # access keys in Supabase (Storage → S3 Connection).
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false                  # e.g. documents
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false                  # https://<project-ref>.supabase.co/storage/v1/s3
      - key: AWS_S3_REGION_NAME
        sync: false                  # e.g. ca-central-1
      # ── At-rest encryption for medical data — PIN ONCE, NEVER ROTATE ────
      # Dedicated Fernet key so rotating SECRET_KEY can't make encrypted
      # medical fields unreadable. Must match the value in the cron workflow's
      # secrets. If unset it derives from SECRET_KEY (dev only).
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      # ── Error monitoring (no-op until set) ──────────────────────────────
      - key: SENTRY_DSN
        sync: false                  # DSN from sentry.io project settings
      # ── Admin bootstrap (reconciled every deploy by ensure_superuser) ───
      # Point DJANGO_SUPERUSER_EMAIL at the desired admin address; the next
      # deploy creates/ensures that admin. Password is applied on create (or
      # when DJANGO_SUPERUSER_FORCE_PASSWORD=1).
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false                  # e.g. mustaphaukizuru@interlaken.com.mx
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_FIRST_NAME
        sync: false
      - key: DJANGO_SUPERUSER_LAST_NAME
        sync: false
      # ── Cafetería / Loyverse ────────────────────────────────────────────
      # Shared secret for the near-real-time receipts webhook. Set the SAME value
      # in Loyverse's webhook config (sent as the X-Webhook-Token header). Blank
      # leaves the endpoint fail-closed; the ~10-min poll stays the fallback.
      - key: LOYVERSE_WEBHOOK_SECRET
        sync: false
      # True → digest mode: per-purchase cafetería pings off, one daily roll-up
      # via the send_spending_digest cron. Default False (immediate per-purchase).
      - key: CAFETERIA_PURCHASE_DIGEST
        sync: false
