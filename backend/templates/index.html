<!doctype html>
<!--
  PLACEHOLDER — not the production shell.

  The real index.html is generated by the Vite build and injected at deploy time:
    · Docker (Render): stage 1 builds the SPA and COPYs dist/index.html over this file.
    · Locally, for prod-style serving: python scripts/build_frontend.py

  Do NOT commit the generated version. It embeds hashed asset filenames that go
  stale on the next source change (that happened twice: the committed copy drifted
  a full autopilot round behind, and again one PR after being refreshed). Keeping a
  hash-free placeholder in git means this file can never lie about what it serves.

  Django serves it through the SPA catch-all (config/core urls, TemplateView).
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Colegio Interlaken</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f4fa;
        color: #1a1130;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 34rem;
        background: #fff;
        border: 1px solid #eceaf3;
        border-radius: 18px;
        padding: 32px;
      }
      h1 { font-size: 1.25rem; margin: 0 0 12px; }
      p { margin: 0 0 8px; color: #6e6885; line-height: 1.6; }
      code {
        background: #f5f4fa;
        border-radius: 6px;
        padding: 2px 6px;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Interfaz no compilada</h1>
      <p>
        Este servidor está funcionando, pero la aplicación web todavía no se ha
        compilado en este entorno.
      </p>
      <p>
        Ejecute <code>python scripts/build_frontend.py</code> para generar la
        interfaz, o use el servidor de desarrollo de Vite.
      </p>
    </div>
  </body>
</html>
